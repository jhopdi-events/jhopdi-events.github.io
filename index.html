<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vrindavan Property Expo 1.0 — Register Your Slot</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Jost', sans-serif;
    background: #0d0d2b;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 20%, rgba(83,74,183,0.18) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(212,175,55,0.1) 0%, transparent 60%);
    pointer-events: none;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    width: 100%;
    max-width: 480px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }

  .header {
    background: #12124a;
    padding: 1.75rem 1.75rem 1.5rem;
    text-align: center;
    border-bottom: 3px solid #c9a227;
    position: relative;
  }

  .header-logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 1.1rem;
  }

  .logo-text {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    color: #c9a227;
    letter-spacing: 0.04em;
  }

  .logo-divider {
    width: 1px;
    height: 22px;
    background: rgba(201,162,39,0.4);
  }

  .logo-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
    font-weight: 400;
    letter-spacing: 0.05em;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: #c9a227;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .header h1 span {
    display: block;
    font-size: 18px;
    color: #fff;
  }

  .stars {
    font-size: 14px;
    letter-spacing: 4px;
    color: #c9a227;
    margin: 8px 0;
  }

  .event-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 10px;
  }

  .event-info p {
    font-size: 12.5px;
    color: rgba(255,255,255,0.72);
    font-weight: 400;
  }

  .event-info p strong {
    color: #e8c84a;
    font-weight: 500;
  }

  .body {
    padding: 1.75rem 1.75rem 2rem;
    background: #fff;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #1a1a4e;
    margin-bottom: 7px;
    letter-spacing: 0.02em;
  }

  .form-label .req { color: #c0392b; }

  .field {
    margin-bottom: 1.1rem;
  }

  input[type="text"],
  input[type="tel"] {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e0dff5;
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Jost', sans-serif;
    color: #111;
    background: #fafafa;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus,
  input[type="tel"]:focus {
    border-color: #534AB7;
    background: #fff;
  }

  .slot-label {
    font-size: 13px;
    font-weight: 500;
    color: #1a1a4e;
    margin-bottom: 10px;
    display: block;
  }

  .slot-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 1.4rem;
  }

  .slot-btn {
    border: 1.5px solid #d4d2ef;
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.18s;
    background: #fafafa;
  }

  .slot-btn .time {
    font-size: 17px;
    font-weight: 500;
    color: #1a1a4e;
    display: block;
  }

  .slot-btn .tag {
    font-size: 11px;
    color: #888;
    margin-top: 2px;
    display: block;
  }

  .slot-btn:hover {
    border-color: #534AB7;
    background: #f0eefd;
  }

  .slot-btn.active {
    border-color: #534AB7;
    background: #12124a;
  }

  .slot-btn.active .time {
    color: #c9a227;
  }

  .slot-btn.active .tag {
    color: rgba(255,255,255,0.6);
  }

  input[type="hidden"] { display: none; }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: #12124a;
    color: #c9a227;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Jost', sans-serif;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.2s;
    margin-top: 0.5rem;
  }

  .submit-btn:hover { background: #1e1e6e; }
  .submit-btn:active { transform: scale(0.99); }

  .footer-note {
    text-align: center;
    font-size: 11.5px;
    color: #aaa;
    margin-top: 14px;
  }

  /* Success screen */
  .success-screen {
    display: none;
    text-align: center;
    padding: 2.5rem 1.75rem;
    background: #fff;
  }

  .success-icon {
    width: 60px;
    height: 60px;
    background: #eafaf0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
    font-size: 28px;
  }

  .success-screen h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: #12124a;
    margin-bottom: 8px;
  }

  .success-screen p {
    font-size: 14px;
    color: #666;
    line-height: 1.6;
  }

  .success-slot {
    background: #12124a;
    color: #c9a227;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 18px;
    font-weight: 500;
    display: inline-block;
    margin: 1rem 0;
    font-family: 'Playfair Display', serif;
  }

  .whatsapp-cta {
    display: inline-block;
    margin-top: 1rem;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="card">
  <img src="bannerexp1.0.jpg" alt="Vrindavan Property Expo 1.0" style="width:100%; display:block; border-radius: 20px 20px 0 0;" />

  <div class="body" id="formBody">
    <form id="regForm" onsubmit="handleSubmit(event)">

      <div class="field">
        <label class="form-label">Full Name <span class="req">*</span></label>
        <input type="text" id="name" placeholder="Your full name" required />
      </div>

      <div class="field">
        <label class="form-label">Mobile Number <span class="req">*</span></label>
        <input type="tel" id="phone" placeholder="+91 98XXX XXXXX" pattern="[0-9]{10,13}" required />
      </div>

      <div class="field">
        <label class="form-label">City / Coming From <span class="req">*</span></label>
        <input type="text" id="city" placeholder="e.g. Noida, Delhi, Agra..." required />
      </div>

      <span class="slot-label">Select Your Preferred Slot <span class="req">*</span></span>
      <div class="slot-grid">
        <div class="slot-btn" onclick="selectSlot(this, '10:00 AM')">
          <span class="time">10:00 AM</span>
        </div>
        <div class="slot-btn" onclick="selectSlot(this, '11:00 AM')">
          <span class="time">11:00 AM</span>
        </div>
        <div class="slot-btn" onclick="selectSlot(this, '12:30 PM')">
          <span class="time">12:30 PM</span>
        </div>
        <div class="slot-btn" onclick="selectSlot(this, '2:00 PM')">
          <span class="time">2:00 PM</span>
        </div>
        <div class="slot-btn" onclick="selectSlot(this, '3:00 PM')">
          <span class="time">3:00 PM</span>
        </div>
        <div class="slot-btn" onclick="selectSlot(this, '5:00 PM')">
          <span class="time">5:00 PM</span>
        </div>
      </div>
      <input type="hidden" id="selectedSlot" required />

      <button type="submit" class="submit-btn">Book My Slot →</button>
      <p class="footer-note">Team Jhopdi.com will confirm via WhatsApp</p>

    </form>
  </div>

  <div class="success-screen" id="successScreen">
    <div class="success-icon">✓</div>
    <h2>You're Registered!</h2>
    <p>Thank you, <strong id="sName"></strong>.<br/>Your slot is confirmed for</p>
    <div class="success-slot" id="sSlot"></div>
    <p style="font-size:13px; color:#888;">Saturday, 30 May 2026 · Lemon Tree, Noida</p>
    <br/>
    <a href="https://wa.me/919XXXXXXXXX?text=Hi%2C+I+just+registered+for+Vrindavan+Property+Expo+1.0" class="whatsapp-cta" target="_blank">
      💬 Chat on WhatsApp
    </a>
    <p class="footer-note" style="margin-top:14px;">RSVP · Team Jhopdi.com</p>
  </div>
</div>

<script>
let chosenSlot = '';

function selectSlot(el, value) {
  document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  chosenSlot = value;
  document.getElementById('selectedSlot').value = value;
}

function handleSubmit(e) {
  e.preventDefault();
  if (!chosenSlot) { alert('Please select a time slot.'); return; }

  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const city = document.getElementById('city').value;

  // Send to Google Sheets via your Apps Script Web App URL
  const SHEET_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

  const payload = { name, phone, city, slot: chosenSlot, timestamp: new Date().toLocaleString('en-IN') };

  fetch(SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(() => {});

  // Show success screen
  document.getElementById('sName').textContent = name;
  document.getElementById('sSlot').textContent = chosenSlot;
  document.getElementById('formBody').style.display = 'none';
  document.getElementById('successScreen').style.display = 'block';
}
</script>

</body>
</html>
