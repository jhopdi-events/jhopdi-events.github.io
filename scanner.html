<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expo 1.0 — Entry Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Jost', sans-serif;
    background: #0d0d2b;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 420px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .header {
    background: #12124a;
    padding: 1.25rem;
    text-align: center;
    border-bottom: 3px solid #c9a227;
  }
  .header h1 { font-size: 16px; color: #c9a227; font-weight: 600; }
  .header p { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 3px; }
  .body { padding: 1.25rem; }

  /* Camera toggle button */
  .cam-toggle-btn {
    width: 100%;
    padding: 12px;
    background: #534AB7;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Jost', sans-serif;
    cursor: pointer;
    margin-bottom: 1rem;
    transition: background 0.2s;
  }
  .cam-toggle-btn:hover { background: #3d35a0; }
  .cam-toggle-btn.active { background: #c0392b; }

  /* Camera container */
  .camera-wrap {
    position: relative;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    margin-bottom: 1rem;
    display: none;
  }
  .camera-wrap video {
    width: 100%;
    display: block;
    border-radius: 12px;
  }
  .scanner-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .scanner-frame {
    width: 200px;
    height: 200px;
    border: 3px solid #c9a227;
    border-radius: 12px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    position: relative;
  }
  .scanner-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: #c9a227;
    top: 0;
    animation: scan 2s linear infinite;
    box-shadow: 0 0 8px #c9a227;
  }
  @keyframes scan {
    0%   { top: 0; }
    100% { top: calc(100% - 2px); }
  }
  .cam-status {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-bottom: 0.75rem;
    min-height: 18px;
  }
  .cam-status.active { color: #27ae60; }
  .cam-status.error { color: #e74c3c; }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
    color: #ccc;
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e0dff5;
  }

  /* Manual input */
  .manual-wrap {
    display: flex;
    gap: 8px;
    margin-bottom: 1rem;
  }
  .manual-wrap input {
    flex: 1;
    padding: 10px 14px;
    border: 1.5px solid #e0dff5;
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Jost', sans-serif;
    color: #111;
    outline: none;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .manual-wrap input:focus { border-color: #534AB7; }
  .manual-wrap button {
    padding: 10px 18px;
    background: #12124a;
    color: #c9a227;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Jost', sans-serif;
    cursor: pointer;
    white-space: nowrap;
  }
  .manual-wrap button:hover { background: #1e1e6e; }

  /* Result card */
  .result {
    display: none;
    border-radius: 12px;
    padding: 1.25rem;
    text-align: center;
    margin-bottom: 1rem;
  }
  .result.valid   { background: #eafaf0; border: 2px solid #27ae60; }
  .result.invalid { background: #fff0f0; border: 2px solid #e74c3c; }
  .result.duplicate { background: #fff8e1; border: 2px solid #f39c12; }

  .result-icon   { font-size: 44px; margin-bottom: 8px; }
  .result-status { font-size: 20px; font-weight: 700; margin-bottom: 14px; letter-spacing: 0.04em; }
  .result.valid    .result-status { color: #27ae60; }
  .result.invalid  .result-status { color: #e74c3c; }
  .result.duplicate .result-status { color: #f39c12; }

  .result-details { text-align: left; }
  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    font-size: 14px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: #888; }
  .detail-value { font-weight: 500; color: #111; text-align: right; max-width: 60%; }

  .scan-again-btn {
    width: 100%;
    padding: 12px;
    background: #12124a;
    color: #c9a227;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Jost', sans-serif;
    cursor: pointer;
    margin-top: 1rem;
  }
  .scan-again-btn:hover { background: #1e1e6e; }

  .loading {
    text-align: center;
    padding: 1rem;
    color: #888;
    font-size: 14px;
    display: none;
  }

  .scan-count {
    text-align: center;
    font-size: 12px;
    color: #aaa;
    margin-top: 4px;
    padding-bottom: 4px;
  }
  .scan-count span { color: #12124a; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>🎪 Expo 1.0 — Entry Scanner</h1>
    <p>Vrindavan Property Expo | 30 May 2026</p>
  </div>

  <div class="body">

    <!-- Camera Toggle -->
    <button class="cam-toggle-btn" id="camBtn" onclick="toggleCamera()">📷 Start Camera Scanner</button>
    <div class="cam-status" id="camStatus"></div>

    <!-- Camera View -->
    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="scanner-overlay">
        <div class="scanner-frame">
          <div class="scanner-line"></div>
        </div>
      </div>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div class="divider">OR enter code manually</div>

    <!-- Manual Input -->
    <div class="manual-wrap">
      <input type="text" id="manualCode" placeholder="VPE-AB3X7K" maxlength="10" onkeydown="if(event.key==='Enter') verifyManual()" />
      <button onclick="verifyManual()">Verify</button>
    </div>

    <div class="loading" id="loading">⏳ Verifying...</div>

    <!-- Result -->
    <div class="result" id="result">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-status" id="resultStatus"></div>
      <div class="result-details" id="resultDetails"></div>
      <button class="scan-again-btn" onclick="scanAgain()">📷 Scan Next Person</button>
    </div>

    <div class="scan-count">Total entries today: <span id="scanCount">0</span></div>
  </div>
</div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzOlVHLkpitue9zvCPwg2RweGTiFxEZFxsPSVfNaYYPqZJKyESf_NNFbnxeWhU_jK8R/exec';
let scanCount = 0;
let cameraOn = false;
let videoStream = null;
let scanInterval = null;
let lastScanned = '';
let verifying = false;

// ── Camera ──────────────────────────────────────────────
async function toggleCamera() {
  if (cameraOn) {
    stopCamera();
  } else {
    await startCamera();
  }
}

async function startCamera() {
  const btn    = document.getElementById('camBtn');
  const status = document.getElementById('camStatus');
  const wrap   = document.getElementById('cameraWrap');

  btn.textContent = '⏳ Starting camera...';
  btn.disabled = true;
  status.textContent = 'Requesting camera permission...';
  status.className = 'cam-status';

  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });

    const video = document.getElementById('video');
    video.srcObject = videoStream;
    await video.play();

    wrap.style.display = 'block';
    cameraOn = true;
    btn.textContent = '⏹ Stop Camera';
    btn.className = 'cam-toggle-btn active';
    btn.disabled = false;
    status.textContent = '🟢 Camera active — point at QR code';
    status.className = 'cam-status active';

    // Start scanning frames
    scanInterval = setInterval(scanFrame, 300);

  } catch (err) {
    btn.textContent = '📷 Start Camera Scanner';
    btn.disabled = false;
    status.textContent = '❌ Camera access denied — use manual entry below';
    status.className = 'cam-status error';
    console.error('Camera error:', err);
  }
}

function stopCamera() {
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  if (videoStream)  { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }

  const video = document.getElementById('video');
  video.srcObject = null;

  document.getElementById('cameraWrap').style.display = 'none';
  document.getElementById('camBtn').textContent = '📷 Start Camera Scanner';
  document.getElementById('camBtn').className = 'cam-toggle-btn';
  document.getElementById('camStatus').textContent = '';
  document.getElementById('camStatus').className = 'cam-status';
  cameraOn = false;
}

// ── QR Decode via Canvas + BarcodeDetector ──────────────
async function scanFrame() {
  if (verifying) return;
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  try {
    // Use BarcodeDetector API (Chrome/Android)
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['qr_code'] });
      const codes = await detector.detect(canvas);
      if (codes.length > 0) {
        const raw = codes[0].rawValue;
        const code = raw.split('|')[0].trim().toUpperCase();
        if (code && code !== lastScanned) {
          lastScanned = code;
          verifying = true;
          verifyCode(code);
        }
      }
    } else {
      // Fallback: jsQR
      await loadJsQR();
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const result = window.jsQR(imageData.data, imageData.width, imageData.height);
      if (result) {
        const code = result.data.split('|')[0].trim().toUpperCase();
        if (code && code !== lastScanned) {
          lastScanned = code;
          verifying = true;
          verifyCode(code);
        }
      }
    }
  } catch(e) {}
}

// Load jsQR as fallback
function loadJsQR() {
  return new Promise((resolve) => {
    if (window.jsQR) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload = resolve;
    document.head.appendChild(s);
  });
}

// ── Verify Code ─────────────────────────────────────────
function verifyManual() {
  const code = document.getElementById('manualCode').value.trim().toUpperCase();
  if (!code) { alert('Please enter an entry code.'); return; }
  verifyCode(code);
}

function verifyCode(code) {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').style.display = 'none';

  // JSONP call
  const cbName = 'cb_' + Date.now();
  const script = document.createElement('script');
  script.src = SHEET_URL + '?code=' + encodeURIComponent(code) + '&callback=' + cbName;

  const timer = setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
    showResult('invalid', '❌', 'CONNECTION ERROR', [
      { label: 'Code', value: code },
      { label: 'Action', value: 'Check internet & try again' }
    ]);
    cleanup();
    verifying = false;
  }, 10000);

  window[cbName] = function(data) {
    clearTimeout(timer);
    cleanup();
    document.getElementById('loading').style.display = 'none';
    handleResult(data, code);
    verifying = false;
  };

  function cleanup() {
    delete window[cbName];
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  document.body.appendChild(script);
}

function handleResult(data, code) {
  if (data.status === 'valid') {
    scanCount++;
    document.getElementById('scanCount').textContent = scanCount;
    showResult('valid', '✅', 'ENTRY ALLOWED', [
      { label: 'Name',  value: data.name },
      { label: 'Slot',  value: data.slot },
      { label: 'Phone', value: data.phone },
      { label: 'Code',  value: code }
    ]);
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

  } else if (data.status === 'already_scanned') {
    showResult('duplicate', '⚠️', 'ALREADY SCANNED', [
      { label: 'Name',   value: data.name },
      { label: 'Slot',   value: data.slot },
      { label: 'Code',   value: code },
      { label: 'Status', value: '⚠️ Entry already used!' }
    ]);
    if (navigator.vibrate) navigator.vibrate([300]);

  } else {
    showResult('invalid', '❌', 'INVALID CODE', [
      { label: 'Code',   value: code },
      { label: 'Status', value: 'Not found in system' }
    ]);
    if (navigator.vibrate) navigator.vibrate([300]);
  }
}

function showResult(type, icon, status, details) {
  const resultEl = document.getElementById('result');
  resultEl.className = 'result ' + type;
  document.getElementById('resultIcon').textContent = icon;
  document.getElementById('resultStatus').textContent = status;

  let html = '';
  details.forEach(d => {
    html += '<div class="detail-row"><span class="detail-label">' + d.label + '</span><span class="detail-value">' + d.value + '</span></div>';
  });
  document.getElementById('resultDetails').innerHTML = html;
  resultEl.style.display = 'block';
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function scanAgain() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('manualCode').value = '';
  document.getElementById('loading').style.display = 'none';
  lastScanned = '';
  verifying = false;
}
</script>
</body>
</html>
